[tools]
# Match the AWS Glue Python Shell runtime this package actually deploys to.
python = "3.9"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install package + dev/test dependencies into the mise-managed venv"
# Double quotes, not single: mise runs tasks through cmd.exe/PowerShell on
# Windows, where single quotes are not a quoting mechanism and `.[dev,...]`
# gets mangled into `.dev,snowflake]`. Double quotes are honored by cmd,
# PowerShell, and POSIX shells alike.
#
# `-c constraints-glue.txt` pins the dependency set to what the Glue Python
# Shell 3.9 runtime actually ships, so local runs exercise the same
# combination that gets deployed. See constraints-glue.txt for why that
# matters (mismatched numpy/pandas pairs segfault at interpreter shutdown).
run = [
  "python -m ensurepip --upgrade",
  "python -m pip install -c constraints-glue.txt -e \".[dev,snowflake]\"",
]

[tasks.test]
description = "Run unit tests"
run = "python -m pytest -q"

[tasks.build]
description = "Build the wheel"
run = [
  "python -m pip install build",
  "python -m build",
]
