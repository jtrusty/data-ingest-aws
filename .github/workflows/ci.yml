name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded push shouldn't keep burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs against two dependency sets, because they answer different
  # questions and a green run on either alone is misleading.
  #
  #   glue-pinned  the EXACT versions Glue Python Shell 3.9 preinstalls.
  #                This is the combination that actually ships, and this
  #                package's behaviour is coupled to it: int64 -> decimal128
  #                coercion, from_pandas being stricter than Table.cast, and
  #                all-NULL columns inferring as Arrow `null` are all pandas
  #                and pyarrow semantics that move between versions. A suite
  #                green only on floating versions can be green about
  #                behaviour Glue does not have.
  #
  #   floating     whatever pip resolves today. Catches the opposite failure
  #                -- our code breaking on modern pandas/numpy -- which is
  #                the early warning for Glue shipping a newer runtime. See
  #                "WHEN GLUE CHANGES" in constraints-glue.txt.
  #
  # Both block. The coverage floor is enforced once, on the pinned set, so it
  # is not counted twice.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glue-pinned
            constraints: "-c constraints-glue.txt"
            coverage: true
          - name: floating
            constraints: ""
            coverage: false
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      # Match the AWS Glue Python Shell runtime this package deploys to.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install (with the Snowflake extra the Glue job actually uses)
        run: pip install ${{ matrix.constraints }} -e ".[dev,snowflake]"

      # Only `-c`-listed packages are pinned; pytest/moto/werkzeug still
      # float even on the pinned leg. Printing the versions that actually
      # resolved means a failure caused by an upstream release is visible in
      # the log rather than needing a local repro. moto against Glue's
      # botocore 1.24.21 is a pairing nobody upstream tests -- if moto drops
      # support for it, pin moto in the dev extra rather than loosening the
      # constraints file.
      - name: Record the resolved stack
        run: |
          pip check
          pip list | grep -iE "^(pandas|numpy|pyarrow|boto3|botocore|moto|snowflake-connector-python) "

      - name: Tests
        if: ${{ !matrix.coverage }}
        run: pytest -q

      - name: Tests, with a coverage floor
        if: ${{ matrix.coverage }}
        # A floor rather than a target. It exists to catch a whole module
        # arriving untested -- which happened: the Bronze job and Athena
        # client shipped at 23% and 29% while everything around them was
        # covered, and nothing flagged it.
        run: pytest -q --cov=data_ingest --cov-report=term-missing --cov-fail-under=90

  # Packaging and runtime-compatibility checks. Separate from `test` because
  # they build their own venvs and do not depend on how the test job
  # installed anything -- running them once per matrix leg would double the
  # work to reach the identical result.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # The wheel -- not the editable source tree -- is what ships to S3 and
      # gets loaded by Glue, so validate that artifact specifically.
      - name: Wheel installs clean and the Glue entry point imports
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install "$(ls dist/*.whl)[snowflake]"
          # Import the job script's dependency chain, not just the package
          # root: `from data_ingest.sources.snowflake import SnowflakeSource`
          # is what transitively pulls snowflake.connector, i.e. the import
          # that actually breaks when packaging is wrong.
          /tmp/wheel-check/bin/python -c "
          from data_ingest import run_job, run_table
          from data_ingest.sources.snowflake import SnowflakeSource
          print('entry point imports OK')
          "

      # Explicitly assert a CLEAN EXIT, not just successful imports.
      # pandas/pyarrow/snowflake-connector all bind numpy's C API, and on
      # some combinations the interpreter segfaults at shutdown (exit 139)
      # *after* all work completes. Glue reads a non-zero exit as a FAILED
      # run and retries it -- duplicating a landing run that succeeded --
      # so a teardown crash is a real correctness problem, not cosmetic.
      # `run_job` is asserted separately above; this step is only about the
      # process exit status.
      - name: Interpreter exits cleanly against the frozen Glue stack
        run: |
          python -m venv /tmp/glue-stack
          /tmp/glue-stack/bin/pip install -c constraints-glue.txt "$(ls dist/*.whl)[snowflake]"
          /tmp/glue-stack/bin/pip check
          for i in 1 2 3; do
            /tmp/glue-stack/bin/python -c "
          from data_ingest import run_job, run_table
          from data_ingest.landing import LandingWriter
          from data_ingest.sources.snowflake import SnowflakeSource
          "
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::Interpreter exited $status against the frozen Glue stack (139 = segfault at shutdown)."
              exit 1
            fi
          done
          echo "Clean exit on the frozen Glue stack."

      # This project's entire risk profile is "does it coexist with Glue's
      # preinstalled stack." Assert pip is satisfied and would not need to
      # swap anything out at job start.
      - name: Dependency set is internally consistent
        run: /tmp/wheel-check/bin/pip check

      - name: Glue-runtime compatibility (no upgrades against preinstalled versions)
        run: |
          python -m venv /tmp/glue-sim
          # Versions preinstalled by Glue Python Shell 3.9 (--library-set analytics).
          /tmp/glue-sim/bin/pip install "boto3==1.21.21" "botocore==1.24.21" "pandas==1.4.2" "numpy==1.22.3"
          # Installing our wheel on top must NOT try to replace them.
          /tmp/glue-sim/bin/pip install --dry-run --report /tmp/report.json "$(ls dist/*.whl)"
          python - <<'EOF'
          import json, sys

          # What Glue already has; the wheel must accept these as-is.
          PREINSTALLED = {"boto3": "1.21.21", "botocore": "1.24.21", "pandas": "1.4.2", "numpy": "1.22.3"}

          report = json.load(open("/tmp/report.json"))
          conflicts = []
          for item in report.get("install", []):
              meta = item["metadata"]
              name, version = meta["name"].lower(), meta["version"]
              if name in PREINSTALLED and version != PREINSTALLED[name]:
                  conflicts.append(f"{name}: Glue has {PREINSTALLED[name]}, wheel wants {version}")

          if conflicts:
              print("::error::Wheel would replace Glue-preinstalled package(s):")
              for c in conflicts:
                  print(f"  - {c}")
              print("See the RUNTIME CONTRACT comment in pyproject.toml.")
              sys.exit(1)
          print("No Glue-preinstalled package would be replaced.")
          EOF
