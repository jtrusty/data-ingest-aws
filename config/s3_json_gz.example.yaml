# Copy to par_pos_s3_json_gz.yaml and replace bucket names/start_at.
# Source files: s3://pos-events/orders/yyyy/mm/dd/hh/<filename>.json.gz
# Immutable objects; folders must reflect upload time in folder_timezone.
source:
  name: par_pos
  type: s3_json_gz
  # Where the .json.gz files live. Ends immediately BEFORE yyyy/mm/dd/hh.
  # Source-level like database/schema are for relational sources; a table may
  # override with its own s3.location if one source spans sibling prefixes.
  location: s3://pos-events/orders

# No connection/secret: this source uses the Glue job's IAM role.
landing:
  location: s3://my-data-lake/landing
  checkpoint_table: ingestion-checkpoints

bronze:
  database: bronze_par_pos
  location: s3://my-data-lake/bronze
  athena_output: s3://my-data-lake/athena-results/
  processed_runs_table: bronze-processed-runs
  # One database per source, so nothing can collide and the source_key prefix
  # would only be noise in every query. IDENTITY: applied once at CREATE TABLE
  # and never afterwards -- changing it later strands the existing tables.
  table_prefix: none
  # Defaults to month(_s3_last_modified); set before first Bronze run.
  # partition_by: ["month({checkpoint_column})"]

defaults:
  fetch_size: 250
  fail_fast: true

tables:
  - name: orders
    s3:
      # Inclusive first-load boundary in upload time. Quote to keep a string.
      # Set to the earliest upload to ingest; existing checkpoints take precedence.
      start_at: "2026-09-01T00:00:00Z"
      folder_timezone: UTC  # Confirm with producer; e.g. America/Chicago.
      compression: auto    # Inner payload gzip or zlib. Outer is always gzip.
      safety_delay_seconds: 120
      # Which fields become columns. Everything not listed is still retained
      # in envelope_json / payload_json, so a projection is never lossy.
      #
      # CloudEvents core (type, specversion, source, id, time, datacontenttype)
      # is always landed; envelope_fields covers this producer's extensions.
      envelope_fields:
        group_id: groupid
        business_date: businessdate
        historical_data_type: historicaldatatype
      # Dotted paths into the DECODED payload. PAR's envelope `id` is
      # "guid:<order_id>" and the payload repeats that number as its own `id`,
      # so order_id reads the payload copy; event_id keeps the prefixed form.
      # Set these before the first run: Bronze rows already inserted are never
      # revisited if the mapping changes later.
      payload_fields:
        order_id: id
        order_version: version
        payload_business_date: businessDate
      # max_object_bytes: 33554432   # 32 MiB compressed S3 object
      # max_outer_bytes: 134217728   # 128 MiB decompressed outer JSON
      # max_payload_bytes: 16777216  # 16 MiB per decoded payload

    # These defaults are shown explicitly. Keep file identity/time separate
    # from order_id/order_version. Config rejects changing the identity fields.
    primary_key: [_source_record_id]
    checkpoint:
      type: watermark
      column: _s3_last_modified
      lookback_minutes: 15
