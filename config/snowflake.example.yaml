# Example ingestion configuration.
#
# Copy to a real config named <system>_<type>.yaml (e.g. acme_snowflake.yaml,
# which .gitignore keeps untracked because it carries account-specific
# bucket/secret/object names) and upload THAT to S3. The Glue job reads it
# via --config-uri; it is never bundled into the wheel.

source:
  # These two fields together are the SOURCE IDENTITY. They are combined as
  # "<name>_<type>" -- e.g. acme + snowflake -> "acme_snowflake" -- and that
  # derived value is used in exactly two places, which is what keeps the
  # data and its checkpoint from ever drifting apart:
  #
  #   s3://<bucket>/landing/acme_snowflake/<table>/ingest_date=.../run_id=.../
  #   DynamoDB partition key  source_key = "acme_snowflake"
  #
  # Deriving it (rather than having you write "acme_snowflake" by hand) means
  # ingesting the same system over a second protocol later is automatically
  # distinct: an `acme` + `rest` config becomes "acme_rest" and cannot collide,
  # whether or not anyone remembered to disambiguate it.
  #
  # TREAT BOTH AS PERMANENT once a table has run. Changing either changes
  # the derived identity, so the next run finds no checkpoint, does a FULL
  # load, and writes to a new landing tree -- stranding the old one. There is
  # no rename path; it is a re-onboard.
  #
  # `name` is the system being extracted from, not the team or the dataset:
  # prefer the thing a person would name as the upstream ("acme", "workday",
  # "stripe"). Keep it lowercase with underscores -- it becomes an S3 path
  # segment.
  name: acme

  # `type` selects the source adapter (data_ingest.sources.registry) AND is
  # asserted by the Glue job script via expected_source_type, so a config
  # pointed at the wrong job fails at startup instead of silently matching
  # zero tables. Must be a registered type -- currently: snowflake.
  type: snowflake

  # Optional defaults for every table below, so a source whose tables mostly
  # share a database and schema states it once instead of per table. Any
  # table may override either. These are LOCATION, not identity -- nothing
  # keys off them, so changing one is safe (see the tables: section).
  database: MY_DATABASE
  schema: MY_SCHEMA

connection:
  # Secrets Manager secret ID, not the credentials themselves. The secret
  # holds: account, username, password, warehouse, and optionally role.
  secret_id: my-snowflake-readonly-secret

# ---------------------------------------------------------------------------
# Pipeline layers
#
# Each layer owns the same two things: where its data goes, and where its own
# state is tracked. landing.checkpoint_table and bronze.processed_runs_table
# are the same idea one layer apart, which is why the blocks read alike.
#
# Every setting here can also be passed as a Glue job CLI arg (--s3-bucket,
# --state-table, --s3-prefix, --fetch-size, --fail-fast, --bronze-database,
# --athena-output, ...); a CLI arg wins when present. Keeping them in the
# config means a job definition needs only --config-uri, and CLI args stay
# reserved for one-off overrides such as an ad-hoc retry.
# ---------------------------------------------------------------------------

landing:
  # One s3:// URI, matching bronze.location. Deliberately NOT a shared
  # top-level bucket with per-layer prefixes: landing and bronze must not
  # share a lifecycle policy. Landing ages into Glacier and expires, while
  # Iceberg metadata under bronze references physical objects -- expiring
  # those corrupts the table. Separate locations keep separate buckets easy.
  location: s3://my-data-lake-bucket/landing

  # DynamoDB table holding extraction checkpoints -- how far into the source
  # each table has been read. Named checkpoint_table rather than
  # watermark_table because a watermark is only one kind of checkpoint: a
  # REST source uses a cursor, a full-load source has none.
  #
  # Key schema: source_key (HASH), table_name (RANGE). TTL must be DISABLED --
  # a TTL here silently deletes checkpoints, and every affected table then
  # does a full reload. See "DynamoDB state table contract" in README.md.
  checkpoint_table: my-ingestion-checkpoints

# Optional. Delete this whole block to ingest into landing and stop there;
# Bronze is opt-in per source. Landing is the normalization boundary, so this
# section is identical in shape no matter which source produced the data.
bronze:
  database: bronze_acme                       # Glue Data Catalog database

  # Whether Bronze table names carry the source key.
  #
  #   source_key (default)  bronze_acme.acme_snowflake_order_fact
  #   none                  bronze_acme.order_fact
  #
  # The prefix keeps two sources from colliding in ONE Glue database. With a
  # database per source that cannot happen, and the prefix is noise an
  # analyst types forever -- the schema already says which source it is.
  #
  # >>> IDENTITY. SET IT WHEN ONBOARDING, THEN LEAVE IT ALONE. <<<
  #
  # It decides what the tables are CALLED. Changing it later does not rename
  # them; it creates a SECOND set beside the first and strands everything
  # already merged under a name nothing queries. The loader refuses when it
  # detects this, but the only real fix is to drop the old tables, clear
  # their processed-runs rows, and re-merge.
  #
  # Keep it as source_key if several sources share one Bronze database.
  # table_prefix: none
  location: s3://my-data-lake-bucket/bronze   # Iceberg table root
  athena_output: s3://my-data-lake-bucket/athena-results/
  athena_workgroup: primary

  # OPTIONAL -- override only. Omitting this uses the default:
  #
  #     partition_by: ["month({checkpoint_column})"]
  #
  # >>> SET THIS BEFORE THE FIRST BRONZE RUN. <<<
  #
  # The loader issues CREATE TABLE IF NOT EXISTS, so the partition spec is
  # applied exactly once, when the Bronze table is first created. Changing
  # this afterwards does NOTHING: the table already exists, so the setting is
  # read and then ignored, silently. Repartitioning an existing table means
  # an explicit Iceberg partition-spec change in Athena, outside this config.
  #
  # `{checkpoint_column}` is substituted with each table's own watermark
  # column, so one entry covers tables that watermark on different names.
  #
  # Use a TRANSFORM, not a bare timestamp: month(ts) gives ~12 partitions a
  # year, while identity partitioning a second-resolution timestamp would
  # give one per distinct value -- thousands of tiny partitions that cost
  # more than they save. Available: year, month, day, hour, bucket(N, col),
  # truncate(N, col).
  #
  # Why the watermark and not the ingest date: pruning only happens on
  # columns a query predicates on, and the merge matches primary_key +
  # watermark. Ingest date cannot join that clause without breaking dedup, so
  # its partitions would never be pruned -- strictly worse than none.
  #
  # `partition_by: []` disables partitioning entirely. That is a real choice,
  # not a no-op: without it MERGE INTO scans the whole target to evaluate
  # WHEN NOT MATCHED, so merge cost grows with Bronze rather than with the
  # incoming run.
  #
  # partition_by: ["day({checkpoint_column})"]     # higher-volume tables
  # partition_by: []                               # no partitioning

  # DynamoDB table recording which landing runs have been merged.
  # Key schema: table_key (HASH), run_id (RANGE).
  #
  # Optional. Without it, every committed run is re-merged on every pass --
  # which is CORRECT, because the MERGE deduplicates on primary_key +
  # watermark and so re-merging inserts nothing -- but the cost grows with
  # history. It is an optimization, not a correctness mechanism, which is
  # also why a crash between merging and recording a run is harmless.
  processed_runs_table: bronze-processed-runs

# Execution policy, as opposed to the resources above.
defaults:
  # Rows per source batch. 10k, not a larger round number, and the ceiling
  # is memory rather than throughput: a wide fact table at 50k rows per batch
  # exhausts the container and the job is SIGKILLed (exit 137), while 10k
  # carries a 1.3M-row full load. Python Shell is capped at
  # 1 DPU / 16 GB and cannot be scaled up, so this is the main lever.
  # Raise it only with a real run behind it.
  fetch_size: 10000

  # Stop the whole job at the first table failure. Tables that already
  # committed keep their checkpoints; the failed one and everything after it
  # retry on the next execution.
  fail_fast: true

tables:
    # `name` is this table's IDENTITY -- the second half of the pair, after
    # source_key. It selects the table via --tables, names the landing path
    # segment, and is the DynamoDB sort key. Like source.name/type, treat it
    # as permanent once the table has run: renaming it starts a new landing
    # tree and a fresh full load.
    #
    # It is deliberately NOT derived from database/schema/table. Those three
    # say WHERE TO READ FROM and nothing keys off them, so a Snowflake rename
    # or a schema move is a two-line edit here that orphans nothing. They are
    # still captured as lineage -- in _manifest.json, and on every landed row
    # as _source_database / _source_schema / _source_table.
    #
    # Give it the logical name you want downstream (Bronze/Iceberg) to use,
    # not the physical object name.
    #
    # `name` deliberately has no shortcut and is never derived from `table`.
    # Deriving it would mean a Snowflake rename silently changed identity and
    # orphaned the checkpoint -- the exact coupling this design removes.
  - name: fact_order
    table: MY_TABLE_OR_VIEW     # a view is fine; nothing here assumes a table
    # database and schema inherit from source: above. Override either here
    # for a table that lives elsewhere:
    #   schema: SOME_OTHER_SCHEMA
    primary_key:
      - ORDER_KEY               # recorded in the manifest for downstream dedupe
    checkpoint:
      type: watermark
      column: LAST_UPDATE_DTTM
      # Re-scan this many minutes behind the previous high watermark to catch
      # late/backdated rows. Produces intentional duplicates in landing that
      # Bronze must dedupe on primary_key + watermark. 0 disables it.
      lookback_minutes: 0
