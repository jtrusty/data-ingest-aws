# Copy to par_pos_s3_json.yaml and replace bucket names/start_at.
# Source files: s3://pos-events/orders/yyyy/mm/dd/hh/<filename>.json.gz
# Immutable objects; folders must reflect upload time in discovery.timezone.
source:
  name: par_pos          # the producer      -> source_key par_pos_s3_json
  type: s3_json          # the adapter
  location: s3://pos-events/orders   # ends immediately BEFORE the path_format

  # How files are found. ".json.gz" names a compression, not a format, so the
  # layout is configuration rather than a property of the adapter.
  discovery:
    type: time_partitioned
    path_format: "%Y/%m/%d/%H"   # e.g. "year=%Y/month=%m/day=%d/hour=%H"
    timezone: UTC                # Confirm with producer; e.g. America/Chicago.
    suffix: ".json.gz"
    safety_delay_seconds: 120    # upper bound is run start minus this

  # How one object is opened and split into records, and where the payload is.
  document:
    # Shorthand for a wire format that already has a name. Expands to the
    # payload block below and lands the CloudEvents core as columns. Anything
    # stated explicitly still overrides the preset.
    #   cloudevents        data_base64, base64, compressed
    #   cloudevents_plain  data, already-parsed JSON
    #   records            no envelope; the outer records ARE the payload
    preset: cloudevents
    compression: gzip      # the OUTER file: none | gzip | zlib | auto
    records: auto          # object | array | jsonl | auto
    payload:
      path: data_base64    # dotted path; null means the record is the payload
      encoding: base64     # none | base64
      compression: auto    # none | gzip | zlib | auto
      format: json
    # max_object_bytes: 33554432   # 32 MiB compressed S3 object
    # max_outer_bytes: 134217728   # 128 MiB decompressed outer JSON
    # max_payload_bytes: 16777216  # 16 MiB per decoded payload

# No connection/secret: this source uses the Glue job's IAM role.
landing:
  location: s3://my-data-lake/landing
  checkpoint_table: ingestion-checkpoints

bronze:
  database: bronze_par_pos
  location: s3://my-data-lake/bronze
  athena_output: s3://my-data-lake/athena-results/
  processed_runs_table: bronze-processed-runs
  # One database per source, so nothing can collide and the source_key prefix
  # would only be noise in every query. IDENTITY: applied once at CREATE TABLE
  # and never afterwards -- changing it later strands the existing tables.
  table_prefix: none
  # Defaults to month(_s3_last_modified); set before first Bronze run.
  # partition_by: ["month({checkpoint_column})"]

defaults:
  fetch_size: 250
  fail_fast: true

tables:
  - name: orders
    # Inclusive first-load boundary in upload time. Quote to keep a string.
    # Set to the earliest upload to ingest; existing checkpoints take precedence.
    start_at: "2026-09-01T00:00:00Z"

    # Producer extensions past the CloudEvents core, promoted to columns so
    # they can be filtered and partitioned on without parsing JSON.
    envelope_fields:
      group_id: groupid
      business_date: businessdate
      historical_data_type: historicaldatatype

    # What the payload MEANS, as opposed to how it is stored. Declarative:
    # recorded in the manifest as lineage, not enforced during ingestion.
    # Bronze deduplicates on the physical identity below so it retains every
    # published version; this is the logical identity Silver collapses on.
    record:
      natural_key: [id]     # PAR repeats the envelope's "guid:<order_id>" here
      version: version

    # The PHYSICAL replay identity. Fixed, and config rejects changing it.
    primary_key: [_source_record_id]
    checkpoint:
      type: watermark
      column: _s3_last_modified
      lookback_minutes: 15
